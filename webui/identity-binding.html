<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨平台身份关联</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(18px, 4vw, 36px); color: var(--maibot-foreground, #20242b); background: var(--maibot-background, #fff); font: 16px/1.6 var(--maibot-font-body, system-ui, sans-serif); }
    main { max-width: 840px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 3vw, 1.75rem); line-height: 1.3; }
    h2 { margin: 0; font-size: 1.05rem; }
    p { margin: 0; }
    .muted { color: var(--maibot-muted, #56606e); }
    .intro { margin: 0 0 24px; max-width: 66ch; }
    .card, .row, .empty { border: 1px solid var(--maibot-border, #d8dce3); background: var(--maibot-surface, #fff); border-radius: var(--maibot-radius, 12px); padding: clamp(16px, 3vw, 22px); }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 14px 0; }
    label { display: block; margin-bottom: 5px; font-size: .875rem; font-weight: 650; }
    select, input { width: 100%; min-height: 44px; padding: 8px 12px; color: inherit; background: var(--maibot-surface, #fff); border: 1px solid var(--maibot-border, #d8dce3); border-radius: 8px; font: inherit; }
    button { min-height: 44px; padding: 8px 16px; color: inherit; background: var(--maibot-surface, #fff); border: 1px solid var(--maibot-border, #d8dce3); border-radius: 8px; font: inherit; cursor: pointer; }
    .primary { color: var(--maibot-primary-foreground, #fff); background: var(--maibot-primary, #3553bd); border-color: transparent; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--maibot-primary, #4361cf); outline-offset: 3px; }
    .feedback { min-height: 1.6em; margin-top: 10px; font-size: .875rem; }
    .overview { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin: 26px 0 12px; }
    #links { display: grid; gap: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .row p { overflow-wrap: anywhere; }
    .row .muted { font-size: .875rem; }
    .hint { margin-top: 20px; font-size: .875rem; }
    @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } .row { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body class="maibot-page"><main>
  <h1>跨平台身份关联</h1>
  <p class="intro muted">手动选择同一个人的小红书和 QQ 账号。麦麦在小红书私聊时，会收到平台和关联身份的参考信息。</p>
  <section class="card" aria-labelledby="add-title">
    <h2 id="add-title">添加或修改关联</h2>
    <div class="fields">
      <div><label for="xhs">小红书用户</label><select id="xhs" required><option value="">正在读取…</option></select></div>
      <div><label for="qq">QQ 私聊用户</label><select id="qq"><option value="">正在读取…</option></select></div>
    </div>
    <div><label for="qq-manual">或填写麦麦已认识的 QQ 号</label><input id="qq-manual" type="text" inputmode="numeric" pattern="[0-9]{5,20}" maxlength="20" placeholder="不在私聊列表时填写"></div>
    <p class="hint muted">填写 QQ 号时会使用填写的号码。</p>
    <button class="primary" id="save" type="button" disabled>保存关联</button>
    <p class="feedback muted" id="feedback" role="status" aria-live="polite"></p>
  </section>
  <div class="overview"><h2>已关联的用户</h2><button type="button" id="refresh">刷新</button></div>
  <div id="links"><p class="empty muted">正在读取…</p></div>
  <p class="hint muted">只关联你确认是同一个人的账号。这里不会合并人物画像或全部长期记忆；QQ 列表只包含麦麦已建立的私聊，也可填写麦麦已认识的 QQ 号。解绑会停止后续使用关联信息，但已有聊天上下文不会立即删除。</p>
</main>
<script>
  const xhs = document.getElementById('xhs'), qq = document.getElementById('qq'), manual = document.getElementById('qq-manual');
  const links = document.getElementById('links'), feedback = document.getElementById('feedback');
  const save = document.getElementById('save'), refresh = document.getElementById('refresh');
  let busy = false;
  function element(tag, className, value) {
    const el = document.createElement(tag); if (className) el.className = className;
    if (value !== undefined) el.textContent = value; return el;
  }
  function fill(select, items, placeholder) {
    const old = select.value;
    select.replaceChildren(new Option(placeholder, ''));
    for (const item of items) {
      if (!item || typeof item.id !== 'string') continue;
      select.append(new Option(`${item.name || item.id}（${item.id}）`, item.id));
    }
    select.value = items.some(item => item.id === old) ? old : '';
  }
  async function load() {
    save.disabled = true;
    try {
      const result = await window.maibot.query('identities');
      if (!result || !result.available) {
        fill(xhs, [], '请先连接小红书'); fill(qq, [], '请先连接小红书');
        links.replaceChildren(element('p', 'empty muted', '连接小红书后可以管理关联。'));
        return;
      }
      const xs = Array.isArray(result.xhs_users) ? result.xhs_users : [];
      const qs = Array.isArray(result.qq_users) ? result.qq_users : [];
      fill(xhs, xs, xs.length ? '选择小红书用户' : '没有可选的小红书用户');
      fill(qq, qs, qs.length ? '选择 QQ 私聊用户' : '没有已建立的 QQ 私聊');
      const names = (items, id) => items.find(item => item.id === id)?.name || id;
      const rows = Array.isArray(result.links) ? result.links : [];
      if (!rows.length) links.replaceChildren(element('p', 'empty muted', '还没有关联。'));
      else links.replaceChildren(...rows.map(link => {
        const row = element('div', 'row'), text = element('div', '');
        text.append(element('p', '', `${names(xs, link.xhs_user)} ↔ ${names(qs, link.qq_user)}`));
        text.append(element('p', 'muted', `小红书：${link.xhs_user} · QQ：${link.qq_user}`));
        const remove = element('button', '', '解除关联'); remove.type = 'button';
        remove.addEventListener('click', async () => {
          if (busy) return; busy = true; remove.disabled = true; feedback.textContent = '';
          try { await window.maibot.action('unbind', {xhs_user: link.xhs_user}); feedback.textContent = '已解除关联。'; }
          catch (_) { feedback.textContent = '解除失败，请稍后重试。'; }
          finally { busy = false; await load(); }
        });
        row.append(text, remove); return row;
      }));
      save.disabled = !xs.length || busy;
    } catch (_) {
      links.replaceChildren(element('p', 'empty muted', '暂时无法读取用户列表，请检查插件状态。'));
      feedback.textContent = '读取失败，请稍后刷新。';
    }
  }
  save.addEventListener('click', async () => {
    const target = manual.value.trim() || qq.value;
    if (busy || !xhs.value || !target) { feedback.textContent = '请选择或填写 QQ 用户。'; return; }
    if (!/^[0-9]{5,20}$/.test(target)) { feedback.textContent = 'QQ 号应为 5 至 20 位数字。'; return; }
    busy = true; save.disabled = true; feedback.textContent = '';
    try { await window.maibot.action('bind', {xhs_user: xhs.value, qq_user: target}); feedback.textContent = '已保存关联。'; manual.value = ''; }
    catch (_) { feedback.textContent = '保存失败，请刷新列表后重试。'; }
    finally { busy = false; await load(); }
  });
  refresh.addEventListener('click', load);
  window.maibot.ready.then(load).catch(() => { feedback.textContent = '页面连接失败，请返回插件页面后重试。'; });
</script></body></html>
